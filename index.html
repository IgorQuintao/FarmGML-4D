
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmGML-4D (Corrigido)</title>
    <link href="Cesium-1.135/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        /* Bloco CSS ÚNICO E CORRIGIDO */
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";}
        #cesiumContainer { width: 100%; height: 100vh; }
        
        #toolbar {
            position: absolute; /* Flutua sobre o mapa */
            top: 10px;
            left: 10px;
            background-color: rgba(40, 40, 40, 0.8);
            padding: 8px;
            border-radius: 5px;
            z-index: 1; /* Garante que fique sobre o Cesium */
            min-width: 150px; /* Largura mínima */
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            font-family: sans-serif;
            color: white;
        }

        /* Estilo para todos os elementos de formulário */
        #toolbar button, #toolbar select {
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 8px;
            background-color: #303030;
            color: white;
            border: 1px solid #444;
            border-radius: 3px;
            cursor: pointer;
            box-sizing: border-box; /* Garante que o padding não afete a largura */
            font-size: 14px;
        }

        #toolbar button:hover, #toolbar select:hover {
            background-color: #484848;
        }

        /* Div para o "Toggle" */
        .toggle-container {
            display: flex;
            justify-content: space-between; /* Alinha "Toggle" e o switch */
            align-items: center;
            padding: 8px 4px;
        }

        /* --- CSS para o "Toggle Switch" (chave seletora) --- */
        .switch {
            position: relative;
            display: inline-block;
            width: 46px; /* Largura do switch */
            height: 26px; /* Altura do switch */
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            -webkit-transition: .4s;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px; /* Tamanho do círculo */
            width: 18px;  /* Tamanho do círculo */
            left: 4px;
            bottom: 4px;
            background-color: white;
            -webkit-transition: .4s;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #57b32c; /* Cor verde do Sandcastle */
        }

        input:checked + .slider:before {
            -webkit-transform: translateX(20px);
            -ms-transform: translateX(20px);
            transform: translateX(20px);
        }
        /* --- Fim do CSS do "Toggle Switch" --- */

    </style>
</head>
<body>
    
    <div id="toolbar">
        <select id="menuLocalizacao">
            <option value="vicosa">Ir para Viçosa</option>
            <option value="brasilia">Ir para Brasília</option>
            <option value="rio">Ir para Rio de Janeiro</option>
        </select>

        
        <button id="btnDestacarFarm">Exemplo FarmGML</button>

        <div class="toggle-container">
            <span>Prédios (Global)</span>
            <label class="switch">
                <input type="checkbox" id="togglePredios" checked>
                <span class="slider"></span>
            </label>
        </div>

        
        <div class="toggle-container" id="containerToggleEstados">
            <span>Estados (Brasil)</span>
            <label class="switch">
                <input type="checkbox" id="toggleEstados" checked>
                <span class="slider"></span>
            </label>
        </div>
        
    </div>
    
    <div id="cesiumContainer"></div>

    <script src="Cesium-1.135/Build/Cesium/Cesium.js"></script>

<script>
    /* ===============================
       TOKEN CESIUM
       =============================== */
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIwZjU1NjM1Mi05Y2VmLTQzNWQtOWJlZC1lN2ZjOTQ5NTRjNjgiLCJpZCI6MjQ1ODA1LCJpYXQiOjE3MjgwMDc2NTZ9.llL11YcDPkvbe-fCSRdKcOSqjylh8BGXgPLRZKupKoU';

    /* ===============================
       FUNÇÃO PRINCIPAL
       =============================== */
    async function setupCesium() {

        try {

            const viewer = new Cesium.Viewer("cesiumContainer", {
                terrain: Cesium.Terrain.fromWorldTerrain(),
            });

        /* ====================================
        CARREGAR DADOS DO POSTGIS (3D TILES)
        ==================================== */
        document.getElementById("btnDestacarFarm").addEventListener("click", async () => {
            try {
                // 1. ALTERAR TERRENO PARA WGS84 ELLIPSOID (PLANO)
                // Isso remove o relevo 3D das montanhas
                const togglePredios = document.getElementById("togglePredios");
                const toggleEstados = document.getElementById("toggleEstados");
                
                togglePredios.checked = false;
                toggleEstados.checked = false;
                if (primitivesPredios) primitivesPredios.show = false;
                if (dsBrasilEstados) dsBrasilEstados.show = false;
                // Carrega o tileset gerado pelo pg2b3dm
                const tileset = await Cesium.Cesium3DTileset.fromUrl('./camadas/fazendas/tileset.json', {
                    // Melhora a visualização no terreno
                    heightOffset: 1000
                });

                viewer.scene.primitives.add(tileset);

                // Estilização baseada nos atributos do seu banco (ex: ZarcScore)
                tileset.style = new Cesium.Cesium3DTileStyle({
                    color: {
                        conditions: [
                            ['${zarcscore} >= 80', 'color("green", 0.6)'],
                            ['${zarcscore} >= 70', 'color("yellow", 0.6)'], // Cobre de 70 a 79
                            ['${zarcscore} < 70', 'color("orange", 0.6)'],
                            ['true', 'color("white", 0.5)']
                        ]
                    }
                });

                // Voar para a fazenda
                await viewer.zoomTo(tileset);
                
                console.log("Camada FarmGML do PostGIS carregada com sucesso!");
            } catch (error) {
                console.error("Erro ao carregar o tileset:", error);
                alert("Erro ao carregar os dados. Verifique se a pasta 'tileset' está no local correto.");
            }
        });
            /* ===============================
               CORES PADRÃO E DESTAQUE
               =============================== */
            const corPadrao = Cesium.Color.DODGERBLUE.withAlpha(0.4);
            const corDestaque = Cesium.Color.RED.withAlpha(0.6);

            /* ===============================
               CARREGAR PRÉDIOS (OSM)
               =============================== */
            const primitivesPredios = await Cesium.createOsmBuildingsAsync();
            viewer.scene.primitives.add(primitivesPredios);

            /* ===============================
               CARREGAR GEOJSON do BRASIL (ARQUIVO LOCAL)
               =============================== */
            const urlEstadosBrasil = "mapa_Brasil.geojson"; 
            const dsBrasilEstados = await Cesium.GeoJsonDataSource.load(urlEstadosBrasil, {
                stroke: Cesium.Color.WHITE,
                fill: corPadrao,
                strokeWidth: 2
            });await viewer.dataSources.add(dsBrasilEstados);

            /* ====================================
            LÓGICA DOS INTERRUPTORES (TOGGLES)
            ==================================== */

            // Alternar Prédios OSM
            document.getElementById("togglePredios").addEventListener("change", (e) => {
                primitivesPredios.show = e.target.checked;
            });

            // Alternar Estados do Brasil
            document.getElementById("toggleEstados").addEventListener("change", (e) => {
                dsBrasilEstados.show = e.target.checked;
            });


            /* ====================================
               MENU DE LOCALIZAÇÃO (FlyTo)
               ==================================== */
            document.getElementById("menuLocalizacao").addEventListener("change", e => {
                const local = e.target.value;
                const locais = {
                    vicosa:  { lon: -42.8745, lat: -20.7855, altura: 3000 },
                    brasilia:{ lon: -47.9000, lat: -15.8900, altura: 10000 },
                    rio:     { lon: -43.2000, lat: -23.0000, altura: 1500  }
                };
                if (locais[local]) {
                    viewer.camera.flyTo({
                        destination: Cesium.Cartesian3.fromDegrees(
                            locais[local].lon,
                            locais[local].lat,
                            locais[local].altura
                        ),
                        orientation: { heading: 0, pitch: Cesium.Math.toRadians(-45) }
                    });
                }
            });

            /* ====================================
               VISÃO INICIAL (Viçosa)
               ==================================== */
            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(-42.8745, -20.7855, 3000),
                orientation: { heading: 0, pitch: Cesium.Math.toRadians(-44) }
            });

        } catch (error) {
            console.error("ERRO CRÍTICO DURANTE O SETUP DO CESIUM:", error);
            alert("Erro ao carregar o WebGIS. Verifique o console (F12).");
        }
    }

    /* ===============================
       11. INICIAR APLICAÇÃO
       =============================== */
    setupCesium();
</script>
